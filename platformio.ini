; Codey Rocky — custom firmware (ESP32 + Arduino)
; Open this folder in VS Code with the PlatformIO extension, plug in USB, Upload.

[env:codeyrocky]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCODEY_ROCKY=1
monitor_filters = esp32_exception_decoder

; If upload fails: hold button C, tap power, then Upload.
; GPIO0 (button C) is the ESP32 boot strap.
